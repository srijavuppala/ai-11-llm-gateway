# Target list for Srija's outreach. Researched 2026-09-17.
#
# Scope: LLM gateway / observability / eval / agent-infra companies. Deliberately
# narrow. Her two strongest proof points (Comet AI, a multi-provider LLM gateway
# at 25k users, and a merged PR in BerriAI/litellm) are exactly what these
# companies build, so a short list here beats a long list of generic AI startups.
#
# Fields
#   short_name - used in the subject line
#   category   - selects the angle/proof point (compose.py ANGLES)
#   channel    - how she can actually reach them:
#                  founder_email  - they publish a founder address and invite contact
#                  role_inbox     - a published hello@/contact@ style address
#                  form           - web form only, no address published
#                  ats            - Ashby/Greenhouse board; apply, don't cold email
#                  unknown        - needs scrape.py run from an unrestricted network
#   contact    - ONLY a verified, publicly published address. Never a guess.
#   recipient  - first name, when writing to a named person
#   status     - anything that changes whether she should write at all
#   note       - a verifiable fact about them, used as the email's opening line.
#                Blank = compose.py refuses to invent one and blocks the draft.
#   priority   - 1 = send now, 2 = second wave, 3 = only if expanding
#
# NOTE ON 2026 CONSOLIDATION: this market changed hands three times in five
# months. ClickHouse acquired Langfuse (Jan 16), Mintlify acquired Helicone
# (Mar 3), Palo Alto Networks acquired Portkey (closed May 29, now shipping as
# Prisma AIRS AI Gateway). Two of those are no longer sensible "startup
# internship" targets. Kept in the file with status set, so the reason is
# recorded rather than silently dropped.

targets:
  # ===========================================================================
  # TIER 1 - verified address, active company, direct overlap with her work
  # ===========================================================================

  - name: BerriAI (LiteLLM)
    short_name: LiteLLM
    domain: berri.ai
    category: devtools_oss
    channel: founder_email
    contact: krrish@berri.ai
    recipient: Krrish
    priority: 1
    status: "YC W23, ~$4M seed, 53k+ GitHub stars. Publicly hiring engineers; a Head of Engineering role is posted on their YC page. Founders publish krrish@berri.ai and ishaan@berri.ai across their docs under 'Support & Talk to Founders' and invite contact on their YC profile."
    note: "maintain litellm, the open-source gateway that calls 100+ LLMs through one OpenAI-compatible interface"

  - name: E2B
    short_name: E2B
    domain: e2b.dev
    category: agent_infra
    channel: role_inbox
    contact: hello@e2b.dev
    priority: 1
    status: "Publishes hello@e2b.dev as its general contact in its own repos ('Contact us at hello@e2b.dev'). enterprise@e2b.dev is sales-only; do not use it for this."
    note: "run sandboxed cloud runtimes so AI agents can execute untrusted code safely"

  - name: Langfuse
    short_name: Langfuse
    domain: langfuse.com
    category: observability
    channel: role_inbox
    contact: contact@langfuse.com
    priority: 2
    status: "Acquired by ClickHouse on 2026-01-16 but still shipping as a distinct product, and a Langfuse Gateway is on their public roadmap. contact@langfuse.com is published on their legal imprint, so it is a general inbox rather than a hiring one. They also run a /careers page - worth checking before emailing."
    note: "build open-source LLM observability with span-level tracing, and have a Langfuse Gateway on your public roadmap"

